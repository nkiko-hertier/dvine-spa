services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dvine
      POSTGRES_PASSWORD: dvine
      POSTGRES_DB: dvine_spa
    ports:
      - '5432:5432'
    volumes:
      - dvine_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dvine -d dvine_spa']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dvine_pg_data:
